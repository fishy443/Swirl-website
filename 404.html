<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boba Bloom — 404</title>

    <link rel="icon" href="favicon.svg">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff0bd;
            color: #40382d;
        }

        .box {
            max-width: 650px;
            padding: 40px;
        }

        .emoji {
            font-size: 80px;
        }

        h1 {
            font-size: 120px;
            line-height: .8;
            margin: 30px 0;
            color: #c86d5a;
        }

        h2 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            background: #45382d;
            color: white;
            padding: 15px 25px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #c86d5a;
        }

    </style>

</head>


<body>

    <div class="box">

        <div class="emoji">
            🧋
        </div>

        <h1>
            404
        </h1>

        <h2>
            Oops... your boba disappeared.
        </h2>

        <p>
            This page doesn't exist.
            Maybe someone drank it.
        </p>

        <a href="index.html">
            Take me home →
        </a>

    </div>

</body>

</html>
